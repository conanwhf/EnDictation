# 迁移期间仅构建/测试：Azure App Service 部署已按 NAS 迁移计划（docs/NAS_MIGRATION.md 步骤 0）移除。
# 现有 Azure 网页保持已部署版本，不再随 main 推送更新。

name: Build and test EnDictation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create virtual environment
        run: |
          python -m venv venv
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run syntax check
        run: python -m py_compile app.py tasks.py config.py docker_start.py
