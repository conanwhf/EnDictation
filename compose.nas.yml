# NAS 容器编排（docs/NAS_MIGRATION.md §5）
# 仅本机/受信 LAN 验证：端口只绑定回环地址，未来 NAS 的实际端口与 LAN 绑定留到部署阶段确认。
# 不含任何公网组件。
#
# 用法：
#   docker compose -f compose.nas.yml up -d

services:
  endictation:
    build: .
    image: endictation:nas
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # 只绑定回环地址；不使用会绑定全部网卡的 "15901:5001" 简写
      - "127.0.0.1:15901:5001"
    volumes:
      # 保留原卷：config.json、.session-key 和启动时拉取的 source 不随镜像替换。
      # 保持同一 Compose 项目名；不要执行 down -v 或删除此卷。
      - endictation-data:/app/.local-data
    healthcheck:
      # 用 Python 标准库请求 /health，不额外安装 curl；只证明进程可响应
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次 clone 或网络超时可能延长启动；healthcheck 不触发源码更新。
      start_period: 90s

volumes:
  endictation-data:
